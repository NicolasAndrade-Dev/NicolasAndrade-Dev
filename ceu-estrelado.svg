<!-- CRUZES DE LUZ -->

<g stroke="#bae6fd" stroke-width="1" opacity="0.65">

    <line x1="800" y1="58" x2="800" y2="92"/>
    <line x1="783" y1="75" x2="817" y2="75"/>

