<svg width="1600" height="430" viewBox="0 0 1600 430"
xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="45%" stop-color="#07152f"/>
        <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glow">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
        <stop offset="45%" stop-color="#2563eb" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
        <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur">
        <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="starGlow">
        <feGaussianBlur stdDeviation="2"/>
    </filter>

</defs>

<!-- FUNDO -->

<rect width="1600" height="430" fill="url(#sky)"/>

<!-- AURORA / BRILHO -->

<ellipse
    cx="800"
    cy="190"
    rx="650"
    ry="230"
    fill="url(#glow)"
/>

<ellipse
    cx="800"
    cy="360"
    rx="620"
    ry="45"
    fill="#38bdf8"
    opacity="0.10"
    filter="url(#blur)"
/>

