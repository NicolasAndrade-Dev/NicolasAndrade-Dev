<!-- ESTRELAS PRINCIPAIS -->

<g fill="#7dd3fc">

    <circle cx="180" cy="105" r="3"/>
    <circle cx="180" cy="105" r="8" opacity="0.15"/>

    <circle cx="530" cy="95" r="2.5"/>
    <circle cx="530" cy="95" r="7" opacity="0.15"/>

